<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="mandalaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5eb" />
      <stop offset="50%" stop-color="#ffe6cc" />
      <stop offset="85%" stop-color="#ffd199" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#ff9933" />
      <stop offset="100%" stop-color="#aa800e" />
    </linearGradient>
  </defs>

  <!-- Deep Spiritual Glow Background -->
  <circle cx="250" cy="250" r="240" fill="url(#mandalaGlow)" opacity="0.6" />

  <!-- Outer Rays/Petals (Mandala Geometry) -->
  <g stroke="url(#goldGrad)" stroke-width="1" fill="none" opacity="0.4">
    <circle cx="250" cy="250" r="200" stroke-width="1.5" />
    <circle cx="250" cy="250" r="185" stroke-dasharray="3 3" />
    <circle cx="250" cy="250" r="170" />
  </g>

  <!-- Geometric overlapping circles for Mandala pattern -->
  <g stroke="url(#goldGrad)" stroke-width="1" fill="none" opacity="0.55">
    <!-- 12-point circular pattern -->
    <path d="M250,50 C290,130 210,130 250,50 Z" transform="rotate(0 250 250)" />
    <path d="M250,50 C290,130 210,130 250,50 Z" transform="rotate(30 250 250)" />
    <path d="M250,50 C290,130 210,130 250,50 Z" transform="rotate(60 250 250)" />
    <path d="M250,50 C290,130 210,130 250,50 Z" transform="rotate(90 250 250)" />
    <path d="M250,50 C290,130 210,130 250,50 Z" transform="rotate(120 250 250)" />
    <path d="M250,50 C290,130 210,130 250,50 Z" transform="rotate(150 250 250)" />
    <path d="M250,50 C290,130 210,130 250,50 Z" transform="rotate(180 250 250)" />
    <path d="M250,50 C290,130 210,130 250,50 Z" transform="rotate(210 250 250)" />
    <path d="M250,50 C290,130 210,130 250,50 Z" transform="rotate(240 250 250)" />
    <path d="M250,50 C290,130 210,130 250,50 Z" transform="rotate(270 250 250)" />
    <path d="M250,50 C290,130 210,130 250,50 Z" transform="rotate(300 250 250)" />
    <path d="M250,50 C290,130 210,130 250,50 Z" transform="rotate(330 250 250)" />

    <!-- Secondary Star lines -->
    <polygon points="250,75 395,250 250,425 105,250" stroke-width="0.8" />
    <polygon points="250,75 395,250 250,425 105,250" stroke-width="0.8" transform="rotate(45 250 250)" />
    
    <circle cx="250" cy="250" r="120" stroke-width="1.5" />
    <circle cx="250" cy="250" r="95" stroke-dasharray="6 4" />
  </g>

  <!-- Inner Lotus Rings -->
  <g fill="none" stroke="#ff9933" stroke-width="1.2" opacity="0.7">
    <circle cx="250" cy="250" r="70" />
    <!-- Lotus petals outline -->
    <path d="M250,180 C265,210 235,210 250,180 Z" transform="rotate(0 250 250)" fill="#ffd199" fill-opacity="0.15" />
    <path d="M250,180 C265,210 235,210 250,180 Z" transform="rotate(45 250 250)" fill="#ffd199" fill-opacity="0.15" />
    <path d="M250,180 C265,210 235,210 250,180 Z" transform="rotate(90 250 250)" fill="#ffd199" fill-opacity="0.15" />
    <path d="M250,180 C265,210 235,210 250,180 Z" transform="rotate(135 250 250)" fill="#ffd199" fill-opacity="0.15" />
    <path d="M250,180 C265,210 235,210 250,180 Z" transform="rotate(180 250 250)" fill="#ffd199" fill-opacity="0.15" />
    <path d="M250,180 C265,210 235,210 250,180 Z" transform="rotate(225 250 250)" fill="#ffd199" fill-opacity="0.15" />
    <path d="M250,180 C265,210 235,210 250,180 Z" transform="rotate(270 250 250)" fill="#ffd199" fill-opacity="0.15" />
    <path d="M250,180 C265,210 235,210 250,180 Z" transform="rotate(315 250 250)" fill="#ffd199" fill-opacity="0.15" />
  </g>

  <!-- Glowing Aura behind Yogi -->
  <circle cx="250" cy="250" r="45" fill="#ffffff" opacity="0.7" filter="blur(4px)" />
  <circle cx="250" cy="230" r="12" fill="#ffe6cc" opacity="0.9" filter="blur(2px)" />

  <!-- Meditating Yogi Silhouette (Lotus Pose) -->
  <g fill="#4d2600" opacity="0.95" transform="translate(250, 260) scale(0.9)">
    <!-- Head -->
    <circle cx="0" cy="-45" r="10" />
    
    <!-- Torso / Neck -->
    <path d="M -3,-35 L 3,-35 L 5,-10 L -5,-10 Z" />
    
    <!-- Shoulders and Arms in Gyan Mudra on knees -->
    <path d="M -5,-32 C -22,-30 -30,-10 -25,12 C -20,20 -15,10 -15,5 C -15,0 -12,-15 -2,-25" />
    <path d="M 5,-32 C 22,-30 30,-10 25,12 C 20,20 15,10 15,5 C 15,0 12,-15 2,-25" />
    
    <!-- Crossed Legs -->
    <path d="M -32,15 C -30,22 -15,22 0,16 C 15,22 30,22 32,15 C 32,5 20,8 0,8 C -20,8 -32,5 -32,15 Z" />
    
    <!-- Small lotus seat underneath -->
    <path d="M -40,18 C -20,28 20,28 40,18 C 30,12 10,14 0,14 C -10,14 -30,12 -40,18 Z" fill="#ff9933" />
  </g>
</svg>
